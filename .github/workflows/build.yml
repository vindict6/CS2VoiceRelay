name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  plugin:
    name: Server plugin (CounterStrikeSharp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet publish plugin/CS2VoiceRelay.csproj -c Release -o out/addons/counterstrikesharp/plugins/CS2VoiceRelay
      - name: Package
        run: cd out && zip -r ../CS2VoiceRelay-plugin.zip addons
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: CS2VoiceRelay-plugin.zip

  client:
    name: Voice client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --windowed --name CS2VoiceRelay client/voiceclient.py
      - name: Package
        run: Compress-Archive -Path dist/CS2VoiceRelay.exe, client/voiceclient.py, client/requirements.txt -DestinationPath CS2VoiceRelay-client-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: CS2VoiceRelay-client-windows.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/plugin/CS2VoiceRelay-plugin.zip
            artifacts/client/CS2VoiceRelay-client-windows.zip
